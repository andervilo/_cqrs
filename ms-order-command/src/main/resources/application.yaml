spring:
  application:
    name: ms-order-command
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/cqrs}
    username: ${DB_USERNAME:cqrs}
    password: ${DB_PASSWORD:postgres_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: order_command
        default_batch_fetch_size: 50
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    default-schema: order_command
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: ${outbox.relay.send-timeout-ms}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ms-order-command}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    topic: ${OUTBOX_RELAY_TOPIC:cqrs.projections.v1}
    batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
    poll-interval-ms: ${OUTBOX_RELAY_POLL_INTERVAL_MS:1000}
    initial-delay-ms: ${OUTBOX_RELAY_INITIAL_DELAY_MS:5000}
    send-timeout-ms: ${OUTBOX_RELAY_SEND_TIMEOUT_MS:10000}
    retry-initial-delay-ms: ${OUTBOX_RELAY_RETRY_INITIAL_DELAY_MS:1000}
    retry-max-delay-ms: ${OUTBOX_RELAY_RETRY_MAX_DELAY_MS:60000}
    max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:10}
    create-topic: ${OUTBOX_RELAY_CREATE_TOPIC:true}
    partitions: ${OUTBOX_RELAY_PARTITIONS:3}
    replicas: ${OUTBOX_RELAY_REPLICAS:1}
