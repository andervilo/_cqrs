spring:
  application:
    name: ms-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${gateway.connect-timeout-ms}
            response-timeout: 15s
          forwarded:
            enabled: false
          x-forwarded:
            enabled: false
          metrics:
            tags:
              path:
                enabled: false
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
gateway:
  command-service-url: ${COMMAND_SERVICE_URL:http://localhost:8080}
  query-service-url: ${QUERY_SERVICE_URL:http://localhost:8081}
  public-url: ${GATEWAY_PUBLIC_URL:http://localhost:8082}
  cors-allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
  maintenance-enabled: ${GATEWAY_MAINTENANCE_ENABLED:false}
  connect-timeout-ms: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
  query-timeout-ms: ${GATEWAY_QUERY_TIMEOUT_MS:5000}
  command-timeout-ms: ${GATEWAY_COMMAND_TIMEOUT_MS:15000}
  rebuild-timeout-ms: ${GATEWAY_REBUILD_TIMEOUT_MS:60000}
  max-request-bytes: ${GATEWAY_MAX_REQUEST_BYTES:1048576}
  jwt-issuer-uri: ${JWT_ISSUER_URI:}
  jwt-audience: ${JWT_AUDIENCE:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Command API
        url: /v3/api-docs/command
      - name: Query API
        url: /v3/api-docs/query
logging:
  level:
    reactor.netty.http.client: ERROR
