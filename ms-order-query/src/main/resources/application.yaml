spring:
  application:
    name: ms-order-query
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cqrs?connectionTimeZone=UTC&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:cqrs}
    password: ${DB_PASSWORD:mysql_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-init-sql: "SET time_zone = '+00:00'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: ${query.projections.dlt-send-timeout-ms}
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ms-order-query}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

query:
  dashboard:
    stale-seconds: ${QUERY_DASHBOARD_STALE_SECONDS:120}
  projections:
    enabled: ${PROJECTION_CONSUMER_ENABLED:true}
    topic: ${PROJECTION_TOPIC:cqrs.projections.v1}
    dlt-topic: ${PROJECTION_DLT_TOPIC:cqrs.projections.v1.DLT}
    consumer-name: ${PROJECTION_CONSUMER_NAME:order-query-projections}
    concurrency: ${PROJECTION_CONCURRENCY:1}
    max-attempts: ${PROJECTION_MAX_ATTEMPTS:3}
    retry-initial-delay-ms: ${PROJECTION_RETRY_INITIAL_DELAY_MS:1000}
    retry-max-delay-ms: ${PROJECTION_RETRY_MAX_DELAY_MS:10000}
    dlt-send-timeout-ms: ${PROJECTION_DLT_SEND_TIMEOUT_MS:10000}
    create-topics: ${PROJECTION_CREATE_TOPICS:true}
    partitions: ${PROJECTION_PARTITIONS:3}
    replicas: ${PROJECTION_REPLICAS:1}
